<div class="rounded-card border border-border bg-surface p-4">
  <div class="flex flex-wrap items-end gap-3">
    <div class="flex min-w-0 flex-1 basis-60 flex-col gap-1">
      <label for="ticket-search" class="text-xs font-medium text-text-muted">
        Search loaded tickets
      </label>
      <div class="relative">
        <svg
          class="pointer-events-none absolute top-1/2 left-2.5 size-4 -translate-y-1/2 text-text-muted"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="7" cy="7" r="4.5" />
          <path d="m10.5 10.5 3 3" />
        </svg>
        <input
          #search
          id="ticket-search"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Subject, email or ticket id"
          class="h-9 w-full rounded-control border border-border-strong bg-surface ps-8 pe-3 text-sm text-text placeholder:text-text-muted"
          [value]="view().search"
          (input)="searchFor(search.value)"
        />
      </div>
    </div>
    <div class="flex flex-col gap-1">
      <label for="ticket-grouping" class="text-xs font-medium text-text-muted">Group by</label>
      <select
        #grouping
        id="ticket-grouping"
        class="h-9 rounded-control border border-border-strong bg-surface ps-2.5 pe-8 text-sm text-text"
        (change)="groupBy(grouping.value)"
      >
        @for (option of groupingOptions; track option.value) {
          <option [value]="option.value" [selected]="option.value === view().grouping">
            {{ option.label }}
          </option>
        }
      </select>
    </div>
  </div>

  <div class="mt-4 flex flex-col gap-2.5">
    <div
      class="flex flex-wrap items-center gap-1.5"
      role="group"
      aria-labelledby="category-chips-label"
    >
      <span id="category-chips-label" class="w-16 shrink-0 text-xs font-medium text-text-muted">
        Category
      </span>
      @for (chip of categoryChips(); track chip.value) {
        <button
          type="button"
          class="inline-flex h-8 items-center gap-1 rounded-control border border-border bg-surface px-2.5 text-xs font-medium text-text transition-colors duration-150 ease-out-expo hover:bg-surface-sunken active:bg-surface-sunken aria-pressed:border-primary/40 aria-pressed:bg-primary-soft aria-pressed:text-primary"
          [attr.aria-pressed]="chip.pressed"
          (click)="toggleCategory(chip.value)"
        >
          @if (chip.pressed) {
            <svg
              class="size-4 shrink-0"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m3.5 8.5 3 3 6-7" />
            </svg>
          }
          {{ chip.value }}
        </button>
      }
    </div>

    <div
      class="flex flex-wrap items-center gap-1.5"
      role="group"
      aria-labelledby="priority-chips-label"
    >
      <span id="priority-chips-label" class="w-16 shrink-0 text-xs font-medium text-text-muted">
        Priority
      </span>
      @for (chip of priorityChips(); track chip.value) {
        <button
          type="button"
          class="inline-flex h-8 items-center gap-1 rounded-control border border-border bg-surface px-2.5 text-xs font-medium text-text transition-colors duration-150 ease-out-expo hover:bg-surface-sunken active:bg-surface-sunken aria-pressed:border-primary/40 aria-pressed:bg-primary-soft aria-pressed:text-primary"
          [attr.aria-pressed]="chip.pressed"
          (click)="togglePriority(chip.value)"
        >
          @if (chip.pressed) {
            <svg
              class="size-4 shrink-0"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m3.5 8.5 3 3 6-7" />
            </svg>
          }
          <app-priority-badge [priority]="chip.value" />
        </button>
      }
    </div>
  </div>

  @if (hidesUnclassified()) {
    <p class="mt-3 flex items-start gap-2 text-xs text-text-muted">
      <svg
        class="mt-px size-4 shrink-0"
        viewBox="0 0 16 16"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="8" cy="8" r="6" />
        <path d="M8 7.25v3.5M8 5.25v.01" />
      </svg>
      Tickets without a category or priority yet are hidden while these filters are on.
    </p>
  }

  <div
    class="mt-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-2 border-t border-border pt-3"
  >
    <label class="inline-flex min-h-9 cursor-pointer items-center gap-2 text-sm text-text">
      <input
        #hidden
        type="checkbox"
        class="size-4 shrink-0 cursor-pointer"
        [checked]="view().query.includeHidden"
        (change)="showHidden(hidden.checked)"
      />
      Show tickets triage gave up on
    </label>
    @if (filtered()) {
      <button
        type="button"
        class="h-9 rounded-control px-3 text-sm font-medium text-primary transition-colors duration-150 ease-out-expo hover:bg-primary-soft active:bg-primary-soft"
        (click)="clearFilters()"
      >
        Clear filters
      </button>
    }
  </div>
</div>
