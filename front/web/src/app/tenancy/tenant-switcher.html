<!--
  The monogram colours are built from the tenant's own hue, so they cannot be fixed role tokens. Both pairs keep text
  above 7:1 (light: L 92% on L 32%; dark: L 94% on L 38%), whatever the hue.
-->
<button
  type="button"
  popovertarget="tenant-switcher-panel"
  class="trigger inline-flex h-9 max-w-full items-center gap-2 rounded-control border border-border-strong bg-surface px-2 text-sm text-text hover:bg-surface-sunken active:bg-surface-sunken"
  [style.--tenant-hue]="current().hue"
>
  <span class="text-text-muted">Tenant</span>
  <span
    aria-hidden="true"
    class="inline-flex size-6 shrink-0 items-center justify-center rounded-full bg-[oklch(92%_0.06_var(--tenant-hue))] text-xs font-semibold text-[oklch(32%_0.09_var(--tenant-hue))] dark:bg-[oklch(38%_0.08_var(--tenant-hue))] dark:text-[oklch(94%_0.03_var(--tenant-hue))]"
  >
    {{ current().monogram }}
  </span>
  <span class="truncate font-medium">{{ current().id }}</span>
  <svg
    aria-hidden="true"
    viewBox="0 0 16 16"
    class="size-4 shrink-0 text-text-muted"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m4 6 4 4 4-4" />
  </svg>
</button>

<div
  #panel
  id="tenant-switcher-panel"
  popover
  class="panel w-72 max-w-[calc(100vw-2rem)] rounded-card border-0 bg-surface p-3 text-text shadow-popover"
>
  <p id="known-tenants-label" class="px-2 text-xs font-medium text-text-muted">Known tenants</p>
  <ul aria-labelledby="known-tenants-label" class="mt-1 flex flex-col gap-0.5">
    @for (option of options(); track option.id) {
      <li>
        <button
          type="button"
          class="flex h-11 w-full items-center gap-2 rounded-control px-2 text-start text-sm hover:bg-surface-sunken active:bg-surface-sunken aria-[current=true]:bg-primary-soft aria-[current=true]:font-medium aria-[current=true]:text-primary"
          [style.--tenant-hue]="option.hue"
          [attr.aria-current]="option.isCurrent"
          (click)="switchTo(option.id)"
        >
          <span
            aria-hidden="true"
            class="inline-flex size-6 shrink-0 items-center justify-center rounded-full bg-[oklch(92%_0.06_var(--tenant-hue))] text-xs font-semibold text-[oklch(32%_0.09_var(--tenant-hue))] dark:bg-[oklch(38%_0.08_var(--tenant-hue))] dark:text-[oklch(94%_0.03_var(--tenant-hue))]"
          >
            {{ option.monogram }}
          </span>
          <span class="flex-1 truncate">{{ option.id }}</span>
          @if (option.isCurrent) {
            <svg
              aria-hidden="true"
              viewBox="0 0 16 16"
              class="size-4 shrink-0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="m3.5 8.5 3 3 6-7" />
            </svg>
          }
        </button>
      </li>
    } @empty {
      <li class="px-2 text-sm text-text-muted">No known tenants. Enter a tenant id below.</li>
    }
  </ul>

  <form class="mt-3 border-t border-border px-2 pt-3" [formRoot]="otherForm">
    <label for="other-tenant" class="text-xs font-medium text-text-muted">Other tenant</label>
    <div class="mt-1 flex gap-2">
      <input
        id="other-tenant"
        type="text"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        aria-describedby="other-tenant-error"
        class="h-9 min-w-0 flex-1 rounded-control border border-border-strong bg-surface px-2 text-sm text-text"
        [attr.aria-invalid]="showsOtherError()"
        [formField]="otherForm.tenantId"
      />
      <button
        type="submit"
        class="h-9 shrink-0 rounded-control border border-border-strong bg-surface px-3 text-sm font-medium text-text hover:bg-surface-sunken active:bg-surface-sunken"
      >
        Switch
      </button>
    </div>
    <app-field-error id="other-tenant-error" class="mt-1" [field]="otherForm.tenantId" />
  </form>
</div>

<p class="sr-only" aria-live="polite">{{ announcement() }}</p>
