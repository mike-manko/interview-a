<section aria-labelledby="suggested-reply-heading">
  <div class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
    <h3 id="suggested-reply-heading" class="text-sm font-semibold text-text">Suggested reply</h3>
    <p class="text-xs text-text-muted">AI draft · review before sending</p>
  </div>

  @if (reply(); as reply) {
    <p class="mt-3 max-w-prose text-sm whitespace-pre-wrap text-text" [textContent]="reply"></p>
    <div class="mt-4 flex flex-wrap items-center gap-3">
      <!-- The panel is already sunken, so hover lifts the button instead of sinking it into the panel. -->
      <button
        type="button"
        class="inline-flex h-9 items-center gap-2 rounded-control border border-border-strong bg-surface px-3 text-sm font-medium text-text hover:bg-surface-raised active:bg-surface-sunken disabled:opacity-60"
        (click)="copyReply(reply)"
      >
        <svg
          class="size-4"
          viewBox="0 0 16 16"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
          <path
            d="M10.5 5.5V3.75a1.25 1.25 0 0 0-1.25-1.25h-5.5A1.25 1.25 0 0 0 2.5 3.75v5.5a1.25 1.25 0 0 0 1.25 1.25H5.5"
          />
        </svg>
        Copy reply
      </button>
      <p class="text-sm text-text-muted" aria-live="polite">{{ copyStatusMessage() }}</p>
    </div>
  } @else {
    <p class="mt-3 text-sm text-text-muted">{{ missingReason() }}</p>
  }
</section>
